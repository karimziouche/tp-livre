<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nous contacter</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="header">
            <input type="checkbox" id="menu-toggle">
            <label for="menu-toggle" class="burger" aria-label="Ouvrir le menu">
                <span></span>
                <span></span>
                <span></span>
            </label>
            <nav class="menu">
                <a href="index.html">Accueil</a>
                <a href="nous-contact.html">Nous contacter</a>
            </nav>
            <h1>Ma bibliothèque</h1>
        </header>
        <main class="page-contact">
            <section class="formulaire-contact">
                <h2>Contactez-nous</h2>
                <p>emplissez ce formulaire pour nous envoyer un message.</p>
                <form action="#" method="post">
                    <div class="champ">
                        <label for="nom">Nom</label>
                        <input
                            type="text"
                            id="nom"
                            name="nom"
                            placeholder="Votre nom"
                            required
                        >
                    </div>
                    <div class="champ">
                        <label for="email">E-mail</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Votre adresse e-mail"
                            required
                        >
                    </div>
                    <div class="champ">
                        <label for="sujet">Sujet</label>
                        <input
                            type="text"
                            id="sujet"
                            name="sujet"
                            placeholder="Sujet du message"
                            required
                        >
                    </div>
                    <div class="champ">
                        <label for="message">Message</label>
                        <textarea
                            id="message"
                            name="message"
                            rows="7"
                            placeholder="Ecrivez votre message"
                            required
                            ></textarea>
                    </div>
                    <button type="submit" class="bouton-envoyer">
                        Envoyer
                    </button>
                </form>
            </section>
        </main>
        <footer class="footer">
            <p>&copy; 2026 Ma bibliothèque</p>
        </footer>
    </body>
</html>
